name: Défaut
description: Quelque chose ne fonctionne pas comme prévu
labels: ["défaut"]
body:
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe
      description: Décris ce que tu as vu, pas ce que tu supposes.
      placeholder: |
        Sur la fiche athlète, la vue semaine reste vide alors que des séances
        existent. Message dans la console : ...
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pour le reproduire
      placeholder: |
        1. Se connecter en coach
        2. Ouvrir la fiche de Léa Martin
        3. …
    validations:
      required: true

  - type: dropdown
    id: ou
    attributes:
      label: Où
      options:
        - Production (optiperf-app.vercel.app)
        - Préversion Vercel
        - En local (npm run dev)
      default: 0
    validations:
      required: true

  - type: input
    id: contexte
    attributes:
      label: Appareil et navigateur
      placeholder: iPhone 14, Safari — ou Windows, Chrome

  - type: dropdown
    id: gravite
    attributes:
      label: Gravité
      options:
        - Bloquant — le service est inutilisable
        - Gênant — contournable
        - Cosmétique
      default: 1
    validations:
      required: true
