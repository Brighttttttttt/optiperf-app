name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Déclenché par la merge queue : elle recrée ce contexte pour chaque PR mise
  # à jour contre master avant de la fusionner, sans quoi le check requis
  # n'aurait jamais l'occasion de tourner sur cette branche temporaire.
  merge_group:

# Moindre privilège : la CI ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # Env factice : les tests de fumée n'appellent jamais Supabase.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      # Next réutilise ce cache d'une compilation à l'autre. Clé sur les
      # sources : un cache périmé ferait au pire une compilation complète.
      - name: Cache de compilation Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Le navigateur pèse ~20 s de téléchargement, quatre fois par PR entre
      # les différents workflows. La clé suit `package-lock.json` : toute
      # mise à jour de Playwright invalide le cache, donc on ne joue jamais
      # avec un binaire qui ne correspond pas à la bibliothèque.
      - name: Cache du navigateur Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Les dépendances système (paquets apt) ne sont pas dans le cache : on
      # les pose toujours, mais elles sont déjà largement présentes sur le
      # runner. Seul le téléchargement du navigateur est évité.
      - name: Installer Chromium (Playwright)
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Tests de fumée
        run: npm run test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-fumee
          path: playwright-report/
          retention-days: 7

  # Parcours connectés contre une vraie base : c'est le seul endroit où l'on
  # vérifie qu'une page authentifiée affiche réellement son contenu.
  e2e-authentifie:
    name: E2E authentifiés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Démarre Postgres, l'authentification et l'API en local, et applique
      # les migrations du dépôt — ce qui les valide au passage.
      #
      # `-x` n'allume que ce dont les tests se servent : Postgres, **kong**
      # (la passerelle qui expose /rest/v1 et /auth/v1), **gotrue** (l'auth),
      # **postgrest** (l'API) et **realtime** (la messagerie, dont dépendent
      # `MessageThread` et `Nav`).
      #
      # Écartés : l'interface Studio et son `postgres-meta`, le stockage de
      # fichiers et son `imgproxy` (Optiperf n'utilise pas Supabase Storage),
      # les edge functions, la collecte de logs (`logflare`, `vector`), le
      # pooler de connexions (tout passe par PostgREST) et le serveur SMTP
      # local — aucun parcours connecté ne passe par l'inscription par email,
      # les comptes étant créés par `npm run seed` avec `email_confirm`.
      #
      # Trois tentatives : un port déjà pris sur le runner fait échouer le
      # démarrage sans que rien du dépôt n'y soit pour quelque chose (#157).
      # Une vraie erreur — nom de service inconnu, migration invalide, image
      # indisponible — échouera les trois fois, et le job restera rouge.
      #
      # `supabase stop` entre deux essais : après un démarrage partiel,
      # certains conteneurs tournent déjà et la tentative suivante se
      # heurterait à eux.
      - name: Démarrer Supabase
        run: |
          services=studio,postgres-meta,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,mailpit
          for essai in 1 2 3; do
            echo "::group::Démarrage de Supabase — tentative $essai"
            if supabase start -x "$services"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Démarrage en échec (tentative $essai)."
            supabase stop --no-backup || true
            sleep 10
          done
          echo "::error::Supabase n'a pas démarré après trois tentatives. Ce n'est pas une collision passagère : lire l'erreur ci-dessus."
          exit 1

      - name: Exposer les identifiants locaux
        run: |
          supabase status -o env | sed 's/"//g' > /tmp/supabase.env
          echo "Clés exposées par la CLI :"
          cut -d= -f1 /tmp/supabase.env | sed 's/^/  /'

          lire() { grep "^$1=" /tmp/supabase.env | cut -d= -f2-; }
          # Selon la version de la CLI, les clés sont exposées au nouveau
          # format (PUBLISHABLE/SECRET) ou à l'ancien (ANON/SERVICE_ROLE).
          PUB=$(lire PUBLISHABLE_KEY); [ -z "$PUB" ] && PUB=$(lire ANON_KEY)
          SEC=$(lire SECRET_KEY); [ -z "$SEC" ] && SEC=$(lire SERVICE_ROLE_KEY)
          API=$(lire API_URL)

          if [ -z "$PUB" ] || [ -z "$SEC" ] || [ -z "$API" ]; then
            echo "::error::Identifiants Supabase locaux introuvables"; exit 1
          fi
          echo "Publique : ${PUB:0:10}… · Secrète : ${SEC:0:10}… · API : $API"

          echo "NEXT_PUBLIC_SUPABASE_URL=$API" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUB" >> $GITHUB_ENV
          echo "SUPABASE_SECRET_KEY=$SEC" >> $GITHUB_ENV

      - name: Installer les dépendances
        run: npm ci

      - name: Peupler la base de test
        run: npm run seed

      # Next réutilise ce cache d'une compilation à l'autre. Clé sur les
      # sources : un cache périmé ferait au pire une compilation complète.
      - name: Cache de compilation Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Le navigateur pèse ~20 s de téléchargement, quatre fois par PR entre
      # les différents workflows. La clé suit `package-lock.json` : toute
      # mise à jour de Playwright invalide le cache, donc on ne joue jamais
      # avec un binaire qui ne correspond pas à la bibliothèque.
      - name: Cache du navigateur Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Les dépendances système (paquets apt) ne sont pas dans le cache : on
      # les pose toujours, mais elles sont déjà largement présentes sur le
      # runner. Seul le téléchargement du navigateur est évité.
      - name: Installer Chromium (Playwright)
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Parcours connectés
        run: npm run test:e2e:auth

      # Même base, autre largeur : les vues reprises pour le grand écran
      # (#65). Sans ce passage, rien ne les rejouerait — tout le reste de la
      # suite tourne en Pixel 7.
      - name: Vues en largeur bureau
        run: npm run test:e2e:bureau

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-authentifie
          path: playwright-report/
          retention-days: 7
