name: Smoke production

# Se déclenche quand Vercel signale un déploiement de production réussi :
# vérifie l'URL réellement servie, ce que la CI locale ne peut pas faire
# (routage et cache du CDN).
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  # Ouvrir une issue quand la production tombe : sans cela, l'échec ne vit
  # que dans l'onglet Actions, où il faut penser à aller le voir.
  issues: write

# L'alias public, et non l'`environment_url` du déploiement : les URL
# spécifiques à un déploiement sont derrière le SSO Vercel et répondent
# une redirection d'authentification à toutes les requêtes.
env:
  PROD_URL: https://optiperf-app.vercel.app
  # Valeurs publiques (elles partent déjà dans le navigateur), stockées en
  # variables du dépôt : elles permettent au contrôle de se connecter avec
  # le compte de démonstration et de vérifier qu'une page affiche vraiment
  # son contenu.
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # L'alias bascule vers le nouveau déploiement juste après l'événement :
      # on laisse quelques secondes, puis on réessaie.
      - name: Test de fumée
        run: |
          for attempt in 1 2 3; do
            echo "Tentative $attempt sur $PROD_URL"
            if node scripts/smoke-prod.mjs "$PROD_URL"; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      # Un vrai navigateur, contre le site en ligne : c'est le seul moyen de
      # voir qu'une page répond correctement tout en n'affichant rien.
      - name: Installer les dépendances
        run: npm ci

      - name: Cache du navigateur Playwright
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium (Playwright)
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Contrôle d'affichage en production
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PROD_URL }}
        run: npx playwright test --project=production

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production
          path: playwright-report/
          retention-days: 7

      # Le script dit pourquoi et comment ; le garder hors du YAML le rend
      # lisible et vérifiable seul.
      - name: Ouvrir une alerte
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash scripts/alerte-production.sh
